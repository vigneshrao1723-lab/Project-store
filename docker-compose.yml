# Contact details and order-message settings, shared by the web container and the sweeper (which retries sends).
x-notify-env: &notify-env
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  CONTACT_PHONE: ${CONTACT_PHONE:-}
  CONTACT_CITY: ${CONTACT_CITY:-}
  CONTACT_GITHUB: ${CONTACT_GITHUB:-}
  CONTACT_LINKEDIN: ${CONTACT_LINKEDIN:-}
  SELLER_NAME: ${SELLER_NAME:-}
  SELLER_ADDRESS: ${SELLER_ADDRESS:-}
  SELLER_GSTIN: ${SELLER_GSTIN:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
  WHATSAPP_LANG: ${WHATSAPP_LANG:-}

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: project_store
      MYSQL_USER: store
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    # No password on the command line, where `docker inspect` and `ps` would show it. mysqladmin ping exits 0
    # whenever the server answers, even when it refuses the login, and -h 127.0.0.1 only answers once the real
    # server (not MySQL's temporary start-up server, which has no network port) is up.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://store:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:3306/project_store?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ALLOW_PRACTICE_GATEWAY: ${ALLOW_PRACTICE_GATEWAY:-false}
      RESERVATION_MINUTES: ${RESERVATION_MINUTES:-15}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-10}
      <<: *notify-env
    ports:
      - "${WEB_PORT:-8000}:8000"

  # Frees stock held by unpaid orders even when nobody is browsing.
  sweeper:
    build: .
    restart: unless-stopped
    depends_on:
      web:
        # Healthy means the entrypoint has created the tables, so the first sweep cannot fail.
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://store:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:3306/project_store?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      <<: *notify-env
    # This container runs no web server, so the image's HTTP healthcheck would always fail.
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do FLASK_APP=wsgi.py flask release-expired; FLASK_APP=wsgi.py flask send-messages; sleep 60; done"]

volumes:
  dbdata:
