# Contact details and order-message settings, shared by the web container and the sweeper (which retries sends).
x-notify-env: &notify-env
  CONTACT_NAME: ${CONTACT_NAME:-}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  CONTACT_PHONE: ${CONTACT_PHONE:-}
  CONTACT_CITY: ${CONTACT_CITY:-}
  CONTACT_GITHUB: ${CONTACT_GITHUB:-}
  CONTACT_LINKEDIN: ${CONTACT_LINKEDIN:-}
  SELLER_NAME: ${SELLER_NAME:-}
  SELLER_ADDRESS: ${SELLER_ADDRESS:-}
  SELLER_GSTIN: ${SELLER_GSTIN:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
  WHATSAPP_LANG: ${WHATSAPP_LANG:-}

# Logs are rotated: at most three files of 10 MB per container (the Privacy Policy states this).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:26.7
    logging: *logging
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: project_store
      # The schema owner: used only by the one-shot "migrate" service below (it can create and alter tables).
      MYSQL_USER: store
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      # The least-privilege account the web app and the sweeper use (rows only), created by docker/mysql-init on the
      # first start of an empty volume. For an existing volume, see docs/RELEASE_STEPS_v1.4.md.
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    # No ports: MySQL is reachable only from the other containers on this compose network, never from the host.
    # No password on the command line, where `docker inspect` and `ps` would show it. mysqladmin ping exits 0
    # whenever the server answers, even when it refuses the login, and -h 127.0.0.1 only answers once the real
    # server (not MySQL's temporary start-up server, which has no network port) is up.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One shot, on every `up`: brings the schema to the latest migration and loads the catalogue on first run, as the
  # schema owner, then exits. The web app starts only after it has finished successfully.
  migrate:
    build: .
    logging: *logging
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://store:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:3306/project_store?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      RUN_MIGRATIONS: "1"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      <<: *notify-env
    healthcheck:
      disable: true
    command: ["flask", "db", "current"]

  web:
    build: .
    logging: *logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # rows only: SELECT, INSERT, UPDATE, DELETE on project_store (no DROP, ALTER, GRANT, FILE or SUPER)
      DATABASE_URL: mysql+pymysql://store_app:${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}@db:3306/project_store?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      RUN_MIGRATIONS: "0"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ALLOW_PRACTICE_GATEWAY: ${ALLOW_PRACTICE_GATEWAY:-false}
      RESERVATION_MINUTES: ${RESERVATION_MINUTES:-15}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-10}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0}
      <<: *notify-env
    ports:
      - "${WEB_PORT:-8000}:8000"

  # Frees stock held by unpaid orders and retries order messages, even when nobody is browsing.
  sweeper:
    build: .
    logging: *logging
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://store_app:${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}@db:3306/project_store?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      RUN_MIGRATIONS: "0"
      <<: *notify-env
    # This container runs no web server, so the image's HTTP healthcheck would always fail.
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do FLASK_APP=wsgi.py flask release-expired; FLASK_APP=wsgi.py flask send-messages; sleep 60; done"]

volumes:
  dbdata:
