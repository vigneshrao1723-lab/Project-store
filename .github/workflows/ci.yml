name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: project_store_test
          MYSQL_USER: store
          MYSQL_PASSWORD: store
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Fast suite on SQLite, then the concurrency tests against real MySQL row locks.
      - name: Unit and API tests (SQLite)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      # Also runs the migrations on MySQL, where they are used for real.
      - name: Concurrency and migration tests (MySQL)
        env:
          TEST_DATABASE_URL: mysql+pymysql://store:store@127.0.0.1:3306/project_store_test?charset=utf8mb4
        run: pytest tests/test_concurrency.py tests/test_migrations.py -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: project-store:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -e SECRET_KEY=ci -e DATABASE_URL=sqlite:////tmp/smoke.db -p 8000:8000 project-store:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && exit 0 || sleep 2; done
          docker logs smoke; exit 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
