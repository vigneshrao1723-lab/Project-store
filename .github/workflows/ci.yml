name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: project_store_test
          MYSQL_USER: store
          MYSQL_PASSWORD: store
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # Every package, pinned with hashes: the same versions locally, in CI and in the image.
      - run: pip install --require-hashes -r requirements-dev.lock
      # Fast suite on SQLite, then the concurrency tests against real MySQL row locks.
      - name: Unit and API tests (SQLite)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      # Also runs the migrations and the sign-in and request rate limiters on MySQL, where they are used for real.
      - name: Concurrency and migration tests (MySQL)
        env:
          TEST_DATABASE_URL: mysql+pymysql://store:store@127.0.0.1:3306/project_store_test?charset=utf8mb4
        run: pytest tests/test_concurrency.py tests/test_migrations.py tests/test_login_throttle.py tests/test_rate_limit.py -v

  # Failing gates: a known-vulnerable dependency, a stale lock file or a medium-severity code finding stops the build.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: pip-audit -r requirements-dev.lock --disable-pip
      - name: Static analysis, medium severity and above (bandit)
        run: bandit -r app wsgi.py -ll
      - name: Lock files match the direct pins
        run: |
          sh scripts/relock.sh
          git diff --exit-code -- requirements.lock requirements-dev.lock

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: project-store:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -e SECRET_KEY="$(openssl rand -hex 32)" -e DATABASE_URL=sqlite:////tmp/smoke.db -p 8000:8000 project-store:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && exit 0 || sleep 2; done
          docker logs smoke; exit 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker image names must be lowercase, but github.repository keeps the repository's capitals
      # (this repo is "Project-store"), which made the push fail with "repository name must be lowercase".
      - name: Lowercase the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
